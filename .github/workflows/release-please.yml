name: Release Please

# Keeps a release PR open on main. Merging it creates the tag and the GitHub
# release (changelog included), then the Release workflow attaches the
# binaries and publishes the image.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      pi_released: ${{ steps.rp.outputs['integrations/pi--release_created'] }}
      opencode_released: ${{ steps.rp.outputs['integrations/opencode--release_created'] }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Tags created with GITHUB_TOKEN do not trigger other workflows, so the
  # release workflow is called from here instead of waiting for the tag push.
  release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: write
      packages: write

  # npm trusted publishing (OIDC): no token is stored. The trusted publisher
  # of each package is bound to THIS workflow file name (release-please.yml),
  # so the publish jobs live here instead of in a reusable workflow. Releases
  # are published directly through OIDC trusted publishing, no token needed.
  publish-pi:
    needs: release-please
    if: ${{ needs.release-please.outputs.pi_released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm publish
        working-directory: integrations/pi

  publish-opencode:
    needs: release-please
    if: ${{ needs.release-please.outputs.opencode_released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm publish
        working-directory: integrations/opencode
