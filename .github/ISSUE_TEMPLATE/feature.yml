name: Feature request
description: Propose a new capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: questions
    attributes:
      label: Open questions
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: How do we know it is done? Prefer a checklist.
    validations:
      required: true
