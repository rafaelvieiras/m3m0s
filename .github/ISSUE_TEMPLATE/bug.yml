name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, transcripts, or database contents. Remove secrets from logs.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Image tag, release version, or commit SHA.
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: How do you run m3m0s?
      options:
        - Docker
        - Binary
        - From source (go run)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output with all secrets removed.
      render: text
