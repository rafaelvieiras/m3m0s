version: 2

project_name: m3m0s

before:
  hooks:
    - sh -c 'cd webui && npm ci && npm run build'

builds:
  - id: m3m0s
    main: ./cmd/m3m0s
    binary: m3m0s
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ldflags:
      - -s -w

archives:
  - id: m3m0s
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Release notes come from CHANGELOG.md (written by release-please); GoReleaser
# only attaches the artifacts to the release that already exists.
changelog:
  disable: true

release:
  mode: keep-existing
